services:
  - type: web
    name: civic-grievance-backend
    env: node
    plan: free
    buildCommand: npm install
    startCommand: node server/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: OTP_HASH_SECRET
        generateValue: true
      - key: OTP_DEMO_MODE
        value: "true"
      - key: DEMO_PHONE_NUMBER
        value: "+919653260119"
      - key: SMS_PROVIDER
        value: fast2sms
