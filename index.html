
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/jpeg" href="/logo.jpg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Bharat Civic Connect | भारत नागरिक सेवा — Submit, track and resolve government grievances through one transparent digital platform. Government of Maharashtra." />
    <meta name="keywords" content="government grievance portal, complaint, Maharashtra, citizen services, grievance redressal" />
    <meta name="theme-color" content="#123B63" />
    <!-- Open Graph -->
    <meta property="og:title" content="Bharat Civic Connect | भारत नागरिक सेवा" />
    <meta property="og:description" content="Your Voice. Our Responsibility. Submit, track and resolve government grievances online." />
    <meta property="og:type" content="website" />
    <!-- Preconnect to Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <title>Bharat Civic Connect | भारत नागरिक सेवा | Government of Maharashtra</title>
    <!-- Cloudflare Turnstile Human Verification Challenge -->
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit" async defer></script>
  </head>
  <body>
    <!-- Official Portal Preloader -->
    <div id="portal-preloader">
      <style>
        #portal-preloader {
          position: fixed;
          inset: 0;
          width: 100%;
          height: 100%;
          background: #07192c;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          z-index: 999999;
          font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
          transition: opacity 0.45s ease, visibility 0.45s ease;
        }
        #portal-preloader.fade-out {
          opacity: 0;
          visibility: hidden;
          pointer-events: none;
        }
        .preloader-card {
          display: flex;
          flex-direction: column;
          align-items: center;
          text-align: center;
          padding: 24px;
          max-width: 360px;
        }
        .emblem-wrapper {
          position: relative;
          width: 84px;
          height: 84px;
          margin-bottom: 20px;
          display: flex;
          align-items: center;
          justify-content: center;
        }
        .emblem-spin-ring {
          position: absolute;
          inset: -4px;
          border-radius: 50%;
          background: conic-gradient(from 0deg, #FF9933 0deg 120deg, #FFFFFF 120deg 240deg, #138808 240deg 360deg);
          animation: emblemSpin 2.2s linear infinite;
          opacity: 0.85;
          filter: drop-shadow(0 0 10px rgba(255, 153, 51, 0.4));
        }
        .emblem-inner {
          position: relative;
          width: 80px;
          height: 80px;
          border-radius: 50%;
          background: #09223e;
          padding: 4px;
          box-shadow: 0 4px 14px rgba(0,0,0,0.5);
          display: flex;
          align-items: center;
          justify-content: center;
          overflow: hidden;
        }
        .emblem-img {
          width: 100%;
          height: 100%;
          object-fit: cover;
          border-radius: 50%;
        }
        .preloader-title {
          font-size: 1.25rem;
          font-weight: 750;
          color: #ffffff;
          margin: 0 0 4px;
          letter-spacing: -0.01em;
        }
        .preloader-subtitle {
          font-size: 0.8125rem;
          color: #94a3b8;
          margin: 0 0 24px;
          font-weight: 500;
        }
        .preloader-bar-bg {
          width: 200px;
          height: 4px;
          background: rgba(255, 255, 255, 0.1);
          border-radius: 999px;
          overflow: hidden;
          position: relative;
          margin-bottom: 12px;
        }
        .preloader-bar-fill {
          position: absolute;
          top: 0;
          left: 0;
          height: 100%;
          width: 40%;
          background: linear-gradient(90deg, #FF9933, #ffffff, #138808);
          border-radius: 999px;
          animation: barProgress 1.5s ease-in-out infinite alternate;
        }
        .preloader-status {
          font-size: 0.75rem;
          color: #64748b;
          letter-spacing: 0.04em;
          text-transform: uppercase;
        }
        @keyframes emblemSpin {
          0% { transform: rotate(0deg); }
          100% { transform: rotate(360deg); }
        }
        @keyframes barProgress {
          0% { left: 0%; width: 25%; }
          100% { left: 75%; width: 25%; }
        }
      </style>
      <div class="preloader-card">
        <div class="emblem-wrapper">
          <div class="emblem-spin-ring"></div>
          <div class="emblem-inner">
            <img src="/logo.jpg" alt="Emblem" class="emblem-img" />
          </div>
        </div>
        <h1 class="preloader-title">Bharat Civic Connect</h1>
        <p class="preloader-subtitle">भारत नागरिक सेवा · Government of Maharashtra</p>
        <div class="preloader-bar-bg">
          <div class="preloader-bar-fill"></div>
        </div>
        <div class="preloader-status">Initializing Portal...</div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Automatically dismiss preloader once DOM / React starts or within fallback timeout
      window.dismissPreloader = function() {
        var el = document.getElementById('portal-preloader');
        if (el && !el.classList.contains('fade-out')) {
          el.classList.add('fade-out');
          setTimeout(function() {
            if (el.parentNode) el.parentNode.removeChild(el);
          }, 500);
        }
      };
      // Fallback safeguard to prevent any potential indefinite freeze
      setTimeout(function() {
        if (window.dismissPreloader) window.dismissPreloader();
      }, 1500);
    </script>
  </body>
</html>
